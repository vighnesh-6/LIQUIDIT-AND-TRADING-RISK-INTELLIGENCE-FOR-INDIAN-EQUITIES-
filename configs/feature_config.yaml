supplementary_market_fear:
  india_vix_features:
    enabled: false  # to be enabled only if candidate ^INDIAVIX is verified with full coverage
    status: "UNRESOLVED_PENDING_PHASE_1"
    candidate_features:
      - name: "vix_close"
      - name: "vix_return_1d"
      - name: "vix_z20"

lrs_weights:
  amihud_ma20_rank: 0.25
  cs_spread_ma10_rank: 0.20
  vol_20d_rank: 0.20
  volume_drought_rank: 0.15
  overnight_gap_abs_rank: 0.10
  idiosyncratic_vol_rank: 0.10

hre_target:
  forward_window_days: 5
  triggers:
    amihud_ratio_cross_sectional_quantile: 0.95
    volume_ratio_threshold: 0.20
    overnight_gap_abs_threshold: 0.05
    lrs_threshold: 75.0
