# Feature Configuration
# ML-Based Liquidity and Trading-Risk Intelligence for Indian Equities
# Total Audited Core Features: 55 (F01 to F55)

feature_pipeline:
  warmup_window_trading_days: 80
  output_dtype: "float32"
  cross_sectional_percentile_calibration: "training_set_distribution"

